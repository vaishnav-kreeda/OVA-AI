// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        minSdkVersion = 24
        compileSdkVersion = 34
        targetSdkVersion = 34

        // We use NDK 23 which has both M1 support and is the side-by-side NDK version from AGP.
        ndkVersion = "23.1.7779620"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.1.4")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("com.google.gms:google-services:4.4.2")
    }
}

// Temporary AGP 8 migration helper for third-party libraries lacking a namespace
subprojects { project ->
    afterEvaluate {
        if (project.plugins.hasPlugin('com.android.library')) {
            def androidExt = project.extensions.findByName('android')
            if (androidExt != null) {
                // Ensure BuildConfig generation is enabled for AGP 8
                try {
                    androidExt.buildFeatures.buildConfig = true
                } catch(Exception ignored) { }
                // Enforce Java 17 for library modules
                try {
                    androidExt.compileOptions.sourceCompatibility = JavaVersion.VERSION_17
                    androidExt.compileOptions.targetCompatibility = JavaVersion.VERSION_17
                } catch(Exception ignored) { }
                def currentNs = null
                try { currentNs = androidExt.namespace } catch(Exception ignored) { }
                if (!currentNs) {
                    def manifestFile = new File(project.projectDir, "src/main/AndroidManifest.xml")
                    if (manifestFile.exists()) {
                        def manifest = new groovy.xml.XmlSlurper(false, false).parse(manifestFile)
                        def pkg = manifest.@package?.text()
                        if (pkg) {
                            androidExt.namespace = pkg
                        }
                    }
                }
            }
        }
    }
}

// Also enforce Java 17 on the app module
tasks.matching { it.name == 'compileDebugJavaWithJavac' || it.name == 'compileReleaseJavaWithJavac' }.configureEach {
    options.release = 17
}

// Force Java 17 toolchain for all Java compile tasks
allprojects {
    tasks.withType(JavaCompile).configureEach { task ->
        try {
            sourceCompatibility = JavaVersion.VERSION_17
            targetCompatibility = JavaVersion.VERSION_17
            options.release = 17
        } catch(Exception ignored) { }
    }
}
